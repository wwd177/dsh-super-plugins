# Reference GitHub Actions workflow template (copy to .github/workflows/ci.yml if your push token grants `workflow` scope)
name: DSH Super Plugins CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Privacy and portability audit
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const forbidden = [
              new RegExp("\\u0077\\u0077f17", "i"),
              new RegExp("Codex" + "Workspace", "i"),
              new RegExp("\\u0046:\\\\\\\\", "i"),
              new RegExp("\\u0046:/", "i"),
            ];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === ".git" || entry.name === "node_modules") continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.isFile()) {
                  const text = fs.readFileSync(full, "utf8");
                  for (const re of forbidden) {
                    if (re.test(text)) throw new Error(`Portability leak in ${full}: ${re}`);
                  }
                }
              }
            }
            walk(".");
            console.log("Privacy & portability audit passed.");
          '

      - name: Run full test suites
        run: npm test

      - name: Verify release manifest parity & install/uninstall smoke when DSH CLI is present
        shell: bash
        run: |
          node ./scripts/verify-release-manifest.mjs --repo .
          if command -v dsh >/dev/null 2>&1; then
            TMP_DSH=$(mktemp -d)
            dsh plugin --profile desktop list
            node ./scripts/install.mjs --dsh-home "$TMP_DSH" --profile desktop --json
            node ./scripts/install.mjs --verify --dsh-home "$TMP_DSH" --profile desktop --json
            node ./scripts/install.mjs --uninstall --dsh-home "$TMP_DSH" --profile desktop --json
            rm -rf "$TMP_DSH"
          else
            echo "DSH CLI not installed in CI runner; skipping live CLI smoke."
          fi
